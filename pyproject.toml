[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-system"
version = "0.1.0"
description = "线性系统课程练习：能控标准型的坐标变换工具"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sympy",
]

[tool.setuptools]
# 只装 utils 这一个包，练习脚本不参与打包
packages = ["utils"]
py-modules = []
package-dir = { "" = "linear_system" }
