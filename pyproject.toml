[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-system-utils"
version = "0.1.0"
description = "线性系统练习/实验复用的算法库：能控规范型、极点配置、解耦控制、Riccati"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sympy",
]

[project.optional-dependencies]
# 库本身不依赖 scipy；个别练习要解 Lyapunov 方程（scipy.linalg）才需要
exercises = [
    "scipy",
]

[tool.setuptools]
# 练习脚本都在 study 盘的 exercises/ 里，这个仓库没有平铺模块
py-modules = []

[tool.setuptools.packages.find]
# 只打包顶层 linear_system_utils 及其子包；python/ 下的 py_01、py_02 是练习脚本，不参与
where = ["."]
include = ["linear_system_utils*"]
