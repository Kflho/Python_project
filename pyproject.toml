[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-system"
version = "0.1.0"
description = "线性系统课程练习：能控标准型的坐标变换工具"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sympy",
]

[tool.setuptools]
# 练习脚本（linear_system/ls_*）不参与打包，只装 utils 及其子包
py-modules = []

[tool.setuptools.packages.find]
# utils 下面按功能分了 cal_matrix_operation / cal_matrix_parameters / cal_pole_placement，
# 用 find + namespaces（这些子目录没有 __init__.py）才能一起装进去
where = ["linear_system"]
include = ["utils*"]
namespaces = true
